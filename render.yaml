# Render Blueprint - a free, no-VPS-cost alternative to docker-compose.yml.
# Deploy: sign up at render.com, "New" -> "Blueprint", point it at this
# repo. Render reads this file and provisions all 3 services; it'll
# prompt for GOOGLE_API_KEY and JWT_SECRET during setup (marked
# sync: false below so real secrets never live in the repo).
#
# First-pass config, not live-verified against Render's current schema -
# if a field name here doesn't match what Render's UI expects, the
# fallback is to create the 3 services manually via "New -> Web Service"
# / "New -> Static Site", using the same build/start commands below.
#
# Free-tier caveat: the 2 web services (chroma, api) spin down after 15
# minutes idle and take ~30-60s to cold-start on the next request.
#
# Chroma runs via Render's native Python runtime (pip install chromadb,
# then its own `chroma run` CLI) rather than the official Docker image -
# a Docker-image service requires a paid instance type on Render, while
# every native runtime (Node, Python, static) is free-tier eligible.
# `plan: free` is pinned explicitly on all 3 services below so none of
# them silently default to a paid instance type again.
#
# Cross-service URLs (CHROMA_URL, CORS_ORIGIN, VITE_API_URL) are literal
# public https://<service-name>.onrender.com values, not `fromService`
# private-network references - confirmed live-broken two ways: (1) free
# web services can send private-network traffic but can't receive it, so
# hr-chat-agent-chroma (free) could never accept hr-chat-agent-api's
# private connection regardless of hostname format; (2) `property: host`
# only ever returns the private hostname anyway, which is useless for
# CORS_ORIGIN (must match the browser's public Origin header) and
# VITE_API_URL (baked into frontend JS that runs in the user's browser,
# which can't reach Render's private network at all). Render gives no
# fromService property for a service's public URL, so these are hardcoded
# from the service `name`s below - rename a service and update these too.

services:
  - type: web
    name: hr-chat-agent-chroma
    runtime: python
    plan: free
    buildCommand: pip install chromadb
    startCommand: chroma run --host 0.0.0.0 --port $PORT --path ./chroma_data

  - type: web
    name: hr-chat-agent-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CHROMA_URL
        value: https://hr-chat-agent-chroma.onrender.com
      - key: CORS_ORIGIN
        value: https://hr-chat-agent-client.onrender.com

  - type: web
    name: hr-chat-agent-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://hr-chat-agent-api.onrender.com
